<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meka-Café</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#3b2314">
<style>
:root{--bg:#fbf4e2;--card:#fffaf0;--ink:#3b2314;--mut:#7a6552;--or:#e0861f;--ok:#2e7d4f;--ko:#b3392b;--line:#e6d7b8}
@media (prefers-color-scheme:dark){:root{--bg:#241710;--card:#33221a;--ink:#f6e9d2;--mut:#bfa78a;--line:#4d3628}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}h1,h2,h3{font-family:Georgia,serif;margin:.2em 0}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.top img{width:46px;height:46px;border-radius:50%}.top b{font:700 19px Georgia,serif;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700}
button.or{background:var(--or);color:#fff}button.ok{background:var(--ok);color:#fff}button.ko{background:var(--ko);color:#fff}
button.gh{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 12px}button.big{width:100%;font-size:18px;padding:15px}button:disabled{opacity:.4}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0 8px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.wrap{flex-wrap:wrap}.mut{color:var(--mut);font-size:14px}.off{opacity:.45}
.er{color:var(--ko);margin:0 0 8px}.red{color:var(--ko);font-weight:700}.code{font-size:28px;letter-spacing:4px;color:var(--ko)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}.timer{font:700 26px Georgia,serif;color:var(--ko)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{flex:1;padding:10px 4px;font-size:14px}
.tot{display:flex;justify-content:space-between;padding:3px 0}.q{display:flex;align-items:center;gap:8px}.hero{text-align:center}.hero img{width:150px;border-radius:50%;animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both,float 3.2s ease-in-out .9s infinite;box-shadow:0 0 0 0 rgba(224,134,31,.5)}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0);box-shadow:0 0 0 0 rgba(224,134,31,.45)}50%{transform:translateY(-8px);box-shadow:0 0 0 14px rgba(224,134,31,0)}}
.hero h1{animation:rise .8s ease-out .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero img,.hero h1{animation:none}}
</style></head><body><main id="app"></main>

const VAPID="COLLE_ICI_LA_CLE_PUBLIQUE_DES_NOTIFICATIONS",PUSH=VAPID.startsWith("B");
const b64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");return Uint8Array.from(atob(s+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))};
const notifCard=()=>!PUSH?"":`<div class="card" style="border-color:var(--or)"><b>🔔 Active les notifications avant de payer</b><p class="mut">Quand ta commande sera prête, tu recevras une notification sur ton téléphone, même écran verrouillé. Sans elle, tu devras garder cette page ouverte. Sur iPhone : ajoute d'abord ce site à ton écran d'accueil.</p>${S.notif=="ok"?'<span class="tag" style="background:#2e7d4f">Notifications activées</span>':S.notif=="no"?'<span class="tag" style="background:#b3392b">Sans notification : garde la page ouverte</span>':'<div class="row"><button class="or sp" onclick="askN()">Autoriser les notifications</button><button class="gh" onclick="S.notif=\'no\';render()">Plus tard</button></div>'}</div>`;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
fmt=n=>(+n).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ")+" F",fee=p=>Math.max(150,Math.ceil(p*.06/10)*10),
pv=x=>Array.isArray(x)?x[0]:x,busy=()=>document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),
rem=o=>60-Math.floor((Date.now()-new Date(o.paid_at))/1000);
const PREF={Yas:["70","71","72","73","90","91","92","93"],Moov:["78","79","96","97","98","99"]};
function togo(s,op){s=s.replace(/[\s.\-]/g,"").replace(/^(\+228|00228|228)/,"");if(!/^\d{8}$/.test(s))return null;const p=s.slice(0,2);return(op?PREF[op].includes(p):Object.values(PREF).some(l=>l.includes(p)))?s:null}
let AC;function beep(f=1400){try{AC=AC||new AudioContext();AC.resume();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.25,n);g.gain.setValueAtTime(0,n+.12);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+.13)}catch(e){}}
document.addEventListener("pointerdown",()=>{try{AC=AC||new AudioContext();AC.resume()}catch(e){}});
const S={v:"home",cafes:[],cafe:null,prods:[],cart:{},phone:"",tok:null,ord:null,oj:"",uid:null,mc:null,tab:"cmd",ords:[],mprods:[],aC:[],aO:[],em:"",notif:"",sub:null,err:"",msg:""};
try{S.tok=localStorage.getItem("mk_tok")}catch(e){}
const er=()=>`<p id="err" class="er">${esc(S.err)}</p>`;
function fail(m){S.err=m;const e=$("#err");if(e)e.textContent=m;else render()}
function go(v){S.v=v;S.err="";S.msg="";render();if(v=="c")loadCafes();if(v=="wait")loadOrd();if(v=="m")boot()}
function head(){return `<div class="top"><img src="${LOGO}" alt=""><b>Meka-Café</b>${S.uid?'<button class="gh" onclick="out()">Déconnexion</button>':""}${S.v!="home"?'<button class="gh" onclick="go(\'home\')">Accueil</button>':""}</div>`}
function render(){$("#app").innerHTML=head()+V[S.v]()}
const V={
home:()=>`<div class="hero"><img src="${LOGO}" alt=""><h1>Commande de chez toi.<br>Viens quand c'est prêt.</h1></div><button class="or big" onclick="go('c')">Je suis client</button><p></p><button class="big" onclick="go('m')">Je suis gérant</button>`,
c:()=>`<h2>Cafétérias</h2>`+(S.cafes.length?S.cafes.map(c=>`<div class="card row"><div class="sp"><h3>${esc(c.name)}</h3><span class="mut">${esc(c.quartier||"")}</span></div><button class="or" onclick="openCafe('${c.id}')">Commander</button></div>`).join(""):'<p class="mut">Aucune cafétéria pour le moment.</p>')+(S.tok?'<button class="gh" onclick="go(\'wait\')">Voir ma dernière commande</button>':""),
menu:()=>{const sub=S.prods.reduce((s,p)=>s+(S.cart[p.id]||0)*p.price,0);return `<h2>${esc(S.cafe.name)}</h2>`+S.prods.map(p=>`<div class="card row ${p.available?"":"off"}"><div class="sp"><b>${esc(p.name)}</b><br><span class="mut">${p.available?fmt(p.price):"Épuisé"}</span></div>${p.available?`<div class="q"><button class="gh" onclick="qt('${p.id}',-1)">−</button><b>${S.cart[p.id]||0}</b><button class="gh" onclick="qt('${p.id}',1)">+</button></div>`:""}</div>`).join("")+`<div class="card"><div class="tot"><span>Plats</span><span>${fmt(sub)}</span></div><div class="tot"><span>Frais de service</span><span>${sub?fmt(fee(sub)):"-"}</span></div><div class="tot"><b>Total</b><b>${sub?fmt(sub+fee(sub)):"-"}</b></div><label class="mut">Ton numéro Mobile Money</label><input type="tel" placeholder="90 00 00 00" value="${esc(S.phone)}" oninput="S.phone=this.value">${er()}${notifCard()}<p class="mut">Paiement : après avoir commandé, tu verras le numéro Mobile Money où envoyer l'argent.</p><p class="red">Important : après ta commande, tu reçois un numéro de commande et un code à 4 chiffres. Donne-les au gérant quand tu viens. Ne les donne à personne d'autre.</p><button class="or big" ${sub&&(S.notif||!PUSH)?"":"disabled"} onclick="order()">Commander</button></div>`},
wait:()=>{const o=S.ord;if(!o)return '<p class="mut">Chargement…</p>';const L={awaiting_payment:["En attente de paiement","#e0861f",`<b>Envoie ${fmt(o.total)} par Moov Money au ${PAYNUM}</b><br>Mets le numéro de commande ${o.order_id} en référence si tu peux. Dès que ton paiement est reçu, ta commande part chez le gérant et ton code s'affiche ici. N'envoie l'argent qu'à ce numéro.<br><button class="gh" style="margin-top:8px" onclick="copyNum()">Copier le numéro</button>`],paid:["Payée, en attente du gérant","#e0861f","Le gérant a 1 minute pour répondre."],accepted:["Acceptée, en préparation","#2e7d4f",""],ready:["Prête ! Viens la chercher","#2e7d4f","Donne ton numéro et ton code au gérant."],to_check:["Prête","#2e7d4f","Donne ton numéro et ton code au gérant."],done:["Remise. Merci !","#2e7d4f",""],refused:["Refusée","#b3392b","Tu seras remboursé."],expired:["Sans réponse du gérant","#b3392b","Tu seras remboursé."]}[o.status]||[o.status,"#777",""];return `<h2>Commande n°${o.order_id} · ${esc(o.cafe_name)}</h2>${o.code?`<div class="card" style="border-color:var(--ko)"><div class="tot"><span>N° de commande</span><b>${o.order_id}</b></div><div class="tot"><span>Code</span><b class="code">${esc(o.code)}</b></div></div>`:""}<div class="card"><span class="tag" style="background:${L[1]}">${L[0]}</span><p>${L[2]}</p></div><div class="card">${o.items.map(i=>`<div class="tot"><span>${i.qty} × ${esc(i.name)}</span><span>${fmt(i.qty*i.price)}</span></div>`).join("")}<div class="tot mut"><span>Frais de service</span><span>${fmt(o.service_fee)}</span></div><div class="tot"><b>Total</b><b>${fmt(o.total)}</b></div></div>`},
m:()=>`<h2>Connexion gérant</h2><div class="card"><label class="mut">E-mail</label><input id="em" type="email" autocomplete="email" value="${esc(S.em)}"><label class="mut">Mot de passe (8 caractères minimum)</label><input id="pw" type="password" autocomplete="current-password"><p class="mut">${esc(S.msg)}</p>${er()}<div class="row"><button class="or sp" onclick="login()">Connexion</button><button class="gh sp" onclick="go('sign')">Créer un compte</button></div><p><button class="gh" onclick="go('forgot')">Mot de passe oublié ?</button></p></div>`,
forgot:()=>`<h2>Mot de passe oublié</h2><div class="card"><label class="mut">Ton e-mail</label><input id="fe" type="email" value="${esc(S.em)}"><p class="mut">${esc(S.msg)}</p>${er()}<button class="or big" onclick="forgot()">Recevoir un lien par e-mail</button></div>`,
newpw:()=>`<h2>Nouveau mot de passe</h2><div class="card"><label class="mut">Nouveau mot de passe (8 caractères minimum)</label><input id="p1" type="password" autocomplete="new-password"><label class="mut">Écris-le encore une fois</label><input id="p2" type="password" autocomplete="new-password">${er()}<button class="or big" onclick="setPw()">Enregistrer</button></div>`,
reg:()=>`<h2>Inscription gérant</h2><div class="card"><label class="mut">Nom</label><input id="nm"><label class="mut">Prénom</label><input id="pn"><label class="mut">Nom de la cafétéria</label><input id="cf"><label class="mut">Quartier</label><input id="qt"><label class="mut">Opérateur Mobile Money</label><select id="op"><option>Yas</option><option>Moov</option></select><label class="mut">Numéro Mobile Money (privé)</label><input id="n1" type="tel"><label class="mut">Écris-le encore une fois</label><input id="n2" type="tel"><p class="mut">Inscription : 2 000 F. Ton compte est vérifié avant d'être activé. Si ta demande est refusée, ou sans réponse en 24 heures, tes 2 000 F te sont rendus.</p>${er()}<button class="or big" onclick="register()">Envoyer ma demande</button></div>`,
sign:()=>V.reg().replace('<h2>Inscription gérant</h2><div class="card">','<h2>Créer mon compte gérant</h2><div class="card"><label class="mut">E-mail</label><input id="em2" type="email" autocomplete="email" placeholder="exemple@mail.com"><label class="mut">Mot de passe (8 caractères minimum)</label><input id="pw2" type="password" autocomplete="new-password">').replace('onclick="register()"','onclick="signReg()"'),
pend:()=>{const s=S.mc.status;return `<h2>${esc(S.mc.name)}</h2><div class="card">${s=="pending"?"<b>Ta demande est en cours de traitement.</b><p>Tu recevras une réponse dans les 24 heures.</p>":s=="rejected"?"<b>Ta demande n'a pas été acceptée.</b><p>Tes 2 000 F te sont rendus.</p>":"<b>Ton compte est suspendu.</b><p>Contacte l'administrateur.</p>"}</div>`},
dash:()=>{const t=`<h2>${esc(S.mc.name)}</h2><div class="tabs"><button class="${S.tab=="cmd"?"":"gh"}" onclick="S.tab='cmd';render()">Commandes</button><button class="${S.tab=="prod"?"":"gh"}" onclick="S.tab='prod';render()">Produits</button></div>`;
if(S.tab=="prod")return t+S.mprods.map(p=>`<div class="card row ${p.available?"":"off"}"><input type="checkbox" style="width:26px;height:26px" ${p.available?"checked":""} onchange="tg('${p.id}',${!p.available})"><div class="sp"><b>${esc(p.name)}</b><br><button class="gh" style="padding:3px 10px" onclick="pr('${p.id}',${p.price})">${fmt(p.price)} ✏️</button></div><button class="gh" onclick="dl('${p.id}')">🗑</button></div>`).join("")+`<div class="card"><b>Ajouter un produit</b><input id="np" placeholder="Nom"><input id="pp" type="number" inputmode="numeric" placeholder="Prix en F"><button class="or" onclick="addp()">Ajouter</button></div>`;
const ST={accepted:"En préparation",ready:"Prête",to_check:"Prête",done:"Remise",refused:"Refusée",expired:"Expirée"};
return t+(S.ords.map(o=>`<div class="card"><div class="row"><b class="sp">Commande n°${o.id}</b>${o.status=="paid"&&rem(o)>0?`<span class="timer">${rem(o)} s</span>`:`<span class="tag" style="background:#7a6552">${ST[o.status]||"Temps écoulé"}</span>`}</div>${o.order_items.map(i=>`<div>${i.qty} × ${esc(i.name)}</div>`).join("")}<p class="mut">Tu reçois ${fmt(o.items_total)} en entier quand le client te donne son code.</p>${o.status=="paid"&&rem(o)>0?`<div class="row"><button class="ok sp" onclick="mm('manager_respond',{p_order:${o.id},p_accept:true})">Accepter</button><button class="ko sp" onclick="mm('manager_respond',{p_order:${o.id},p_accept:false})">Refuser</button></div>`:""}${o.status=="accepted"?`<button class="ok big" onclick="mm('manager_mark_ready',{p_order:${o.id}})">Commande prête</button>`:""}${o.status=="ready"||o.status=="to_check"?`<div class="row"><input id="cd${o.id}" inputmode="numeric" maxlength="4" placeholder="Code à 4 chiffres"><button class="ok" onclick="cf(${o.id})">Valider</button></div>`:""}</div>`).join("")||'<p class="mut">Aucune commande pour le moment. Garde cette page ouverte, avec le son activé.</p>')},
adm:()=>{const O=S.aO,C=S.aC,T=[["dem","Demandes"],["pay","Commandes"],["mg","Gérants"]];let h=`<h2>Administrateur</h2><div class="tabs">${T.map(([k,l])=>`<button class="${S.tab==k?"":"gh"}" onclick="S.tab='${k}';render()">${l}</button>`).join("")}</div>`;
const sec=(t,l,f)=>l.length?`<h3>${t}</h3>`+l.map(f).join(""):"",ph=o=>{const p=pv(pv(o.cafes||{}).cafe_private)||{};return p};
if(S.tab=="dem")h+=C.filter(c=>c.status=="pending").map(c=>{const p=pv(c.cafe_private)||{};return `<div class="card"><h3>${esc(c.name)}</h3><div class="mut">${esc(p.prenom)} ${esc(p.nom)} · ${esc(c.quartier||"")}<br>${esc(p.operator)} · ${esc(p.momo_phone)}</div><p>${c.registration_paid?'<span class="tag" style="background:#2e7d4f">2 000 F reçus</span>':'<span class="tag" style="background:#e0861f">2 000 F non confirmés</span>'}</p><div class="row wrap">${c.registration_paid?"":`<button class="gh" onclick="am('admin_mark_registration_paid',{p_cafe:'${c.id}',p_paid:true})">2 000 F reçus</button>`}<button class="ok" onclick="am('admin_set_cafe_status',{p_cafe:'${c.id}',p_status:'approved'})">Accepter</button><button class="ko" onclick="am('admin_set_cafe_status',{p_cafe:'${c.id}',p_status:'rejected'})">Refuser</button></div></div>`}).join("")||'<p class="mut">Aucune demande.</p>';
if(S.tab=="pay"){const nm=o=>esc(pv(o.cafes||{}).name),b=(o,t,fn,a,c="ok")=>`<button class="${c}" onclick="am('${fn}',{p_order:${o.id}${a||""}})">${t}</button>`;
h+=sec("À confirmer : paiement reçu ?",O.filter(o=>o.status=="awaiting_payment"),o=>`<div class="card"><b>n°${o.id} · ${nm(o)}</b><div class="mut">Cherche dans ton application Moov un paiement de <b>${fmt(o.total)}</b> venant du <b>${esc(o.client_phone)}</b></div>${b(o,"Paiement reçu","admin_mark_order_paid")}</div>`)
+sec("À vérifier (prêtes depuis 2 h, sans code)",O.filter(o=>o.status=="to_check"),o=>`<div class="card"><b>n°${o.id} · ${nm(o)}</b><div class="mut">${fmt(o.total)} · client ${esc(o.client_phone)}</div><div class="row">${b(o,"Payer le gérant","admin_resolve_order",",p_action:'pay_manager'")}${b(o,"Rembourser","admin_resolve_order",",p_action:'refund'","ko")}</div></div>`)
+sec("À envoyer aux gérants",O.filter(o=>o.status=="done"&&!o.payout_sent),o=>{const p=ph(o);return `<div class="card"><b>n°${o.id} · ${nm(o)}</b><div class="mut">Envoie <b>${fmt(o.items_total)}</b> à ${esc(p.operator)} ${esc(p.momo_phone)}</div>${b(o,"Envoyé","admin_mark_payout_sent")}</div>`})
+sec("À rembourser aux clients",O.filter(o=>["refused","expired"].includes(o.status)&&!o.refunded),o=>`<div class="card"><b>n°${o.id} · ${nm(o)}</b><div class="mut">Rends <b>${fmt(o.total)}</b> au ${esc(o.client_phone)}</div>${b(o,"Remboursé","admin_mark_refunded")}</div>`);
if(h.indexOf("<h3>")<0)h+='<p class="mut">Rien à faire pour le moment.</p>'}
if(S.tab=="mg")h+=C.filter(c=>["approved","suspended"].includes(c.status)).map(c=>{const p=pv(c.cafe_private)||{};return `<div class="card row"><div class="sp"><h3>${esc(c.name)}</h3><span class="mut">${esc(p.prenom)} ${esc(p.nom)} · ${esc(p.operator)} ${esc(p.momo_phone)}</span></div><button class="${c.status=="approved"?"gh":"ok"}" onclick="am('admin_set_cafe_status',{p_cafe:'${c.id}',p_status:'${c.status=="approved"?"suspended":"approved"}'})">${c.status=="approved"?"Suspendre":"Réactiver"}</button></div>`}).join("")||'<p class="mut">Aucun gérant.</p>';
return h}};
// ---- client
async function loadCafes(){const{data}=await sb.from("cafes").select("id,name,quartier").eq("status","approved").order("name");S.cafes=data||[];if(S.v=="c")render()}
async function openCafe(id){S.cafe=S.cafes.find(c=>c.id==id);S.cart={};S.prods=[];S.v="menu";render();const{data}=await sb.from("products").select("*").eq("cafe_id",id).order("position").order("created_at");S.prods=data||[];render()}
function qt(id,d){S.cart[id]=Math.max(0,(S.cart[id]||0)+d);render()}
async function askN(){try{if(!("serviceWorker" in navigator)||!("PushManager" in window))throw 0;const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;if(await Notification.requestPermission()!="granted")throw 0;S.sub=(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)})).toJSON();S.notif="ok"}catch(e){S.notif="no"}render()}
async function order(){if(!togo(S.phone))return fail("Ce numéro n'est pas valide. Vérifie et corrige.");const items=Object.entries(S.cart).filter(([k,q])=>q>0).map(([k,q])=>({product_id:k,qty:q}));const{data,error}=await sb.rpc("place_order",{p_cafe:S.cafe.id,p_phone:S.phone,p_items:items});if(error)return fail(error.message);if(S.sub)await sb.rpc("save_push",{p_token:data.token,p_sub:S.sub});S.tok=data.token;S.oj="";S.ord=null;try{localStorage.setItem("mk_tok",S.tok)}catch(e){}go("wait")}
async function loadOrd(){if(!S.tok)return;const{data}=await sb.rpc("get_my_order",{p_token:S.tok}),j=JSON.stringify(data);if(j!==S.oj){const was=S.ord&&S.ord.status;S.oj=j;S.ord=data;if(data&&data.status=="ready"&&was!="ready"){beep(900);try{navigator.vibrate([300,150,300])}catch(e){}document.title="✅ Commande prête !"}if(S.v=="wait")render()}}
// ---- compte
async function boot(){const{data}=await sb.auth.getSession();if(!data.session){S.uid=null;S.v="m";render();return}S.uid=data.session.user.id;const{data:p}=await sb.from("profiles").select("role").eq("id",S.uid).maybeSingle();if(p&&p.role=="admin"){S.v="adm";S.tab="dem";render();return loadAdm()}const{data:c}=await sb.from("cafes").select("*").eq("owner_id",S.uid).maybeSingle();S.mc=c;S.v=!c?"reg":c.status=="approved"?"dash":"pend";S.tab="cmd";render();if(S.v=="dash")loadM()}
async function login(){S.em=$("#em").value.trim();const{error}=await sb.auth.signInWithPassword({email:S.em,password:$("#pw").value});if(error)return fail("E-mail ou mot de passe incorrect.");boot()}
async function signup(){S.em=$("#em").value.trim();const pw=$("#pw").value;if(pw.length<8)return fail("Le mot de passe doit avoir au moins 8 caractères.");const{data,error}=await sb.auth.signUp({email:S.em,password:pw});if(error)return fail(error.message);if(!data.session){S.msg="Compte créé. Confirme ton e-mail, puis connecte-toi.";S.err="";return render()}boot()}
async function out(){await sb.auth.signOut();S.uid=null;S.mc=null;go("home")}
async function signReg(){const g=i=>$("#"+i).value.trim(),op=g("op"),a=togo(g("n1"),op),pw=$("#pw2").value;
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g("em2")))return fail("Cet e-mail n'est pas valide. Vérifie et corrige.");
if(pw.length<8)return fail("Le mot de passe doit avoir au moins 8 caractères.");
if(!g("nm")||!g("pn")||!g("cf"))return fail("Remplis ton nom, ton prénom et le nom de ta cafétéria.");
if(!a)return fail(togo(g("n1"))?"Ce numéro ne correspond pas à un numéro "+op+". Vérifie et corrige.":"Ce numéro n'est pas valide. Vérifie et corrige.");
if(a!==togo(g("n2"),op))return fail("Les deux numéros ne sont pas pareils. Vérifie et corrige.");
const{data,error}=await sb.auth.signUp({email:g("em2"),password:pw});if(error)return fail(error.message);
if(!data.session){S.em=g("em2");S.msg="Compte créé. Confirme ton e-mail, puis connecte-toi : tu pourras finir ton inscription.";S.err="";S.v="m";return render()}
S.uid=data.user.id;const{data:c,error:e2}=await sb.from("cafes").insert({owner_id:S.uid,name:g("cf"),quartier:g("qt")}).select().single();if(e2)return fail("Erreur : "+e2.message);
const q=await sb.from("cafe_private").insert({cafe_id:c.id,nom:g("nm"),prenom:g("pn"),operator:op,momo_phone:a});if(q.error)return fail("Erreur : "+q.error.message);boot()}
async function register(){const g=i=>$("#"+i).value.trim(),op=g("op"),a=togo(g("n1"),op);if(!g("nm")||!g("pn")||!g("cf"))return fail("Remplis ton nom, ton prénom et le nom de ta cafétéria.");if(!a)return fail(togo(g("n1"))?"Ce numéro ne correspond pas à un numéro "+op+". Vérifie et corrige.":"Ce numéro n'est pas valide. Vérifie et corrige.");if(a!==togo(g("n2"),op))return fail("Les deux numéros ne sont pas pareils. Vérifie et corrige.");
const{data:c,error}=await sb.from("cafes").insert({owner_id:S.uid,name:g("cf"),quartier:g("qt")}).select().single();if(error)return fail("Erreur : "+error.message);
const r=await sb.from("cafe_private").insert({cafe_id:c.id,nom:g("nm"),prenom:g("pn"),operator:op,momo_phone:a});if(r.error)return fail("Erreur : "+r.error.message);boot()}
// ---- gérant
async function loadM(){if(!S.mc)return;const[o,p]=await Promise.all([sb.from("orders").select("*,order_items(*)").eq("cafe_id",S.mc.id).order("id",{ascending:false}).limit(30),sb.from("products").select("*").eq("cafe_id",S.mc.id).order("position").order("created_at")]);S.ords=o.data||[];S.mprods=p.data||[];if(S.v=="dash"&&!busy())render()}
async function mm(fn,a){const{error}=await sb.rpc(fn,a);if(error)alert(error.message);loadM()}
async function cf(id){const{data,error}=await sb.rpc("manager_confirm_code",{p_order:id,p_code:$("#cd"+id).value});if(error)alert(error.message);else if(!data.ok)alert(data.message);loadM()}
async function tg(id,v){await sb.from("products").update({available:v}).eq("id",id);loadM()}
async function pr(id,old){const v=parseInt(prompt("Nouveau prix en F :",old));if(!v||v<1)return;await sb.from("products").update({price:v}).eq("id",id);loadM()}
async function dl(id){if(!confirm("Supprimer ce produit ?"))return;await sb.from("products").delete().eq("id",id);loadM()}
async function addp(){const n=$("#np").value.trim(),p=parseInt($("#pp").value);if(!n||!p||p<1)return alert("Entre un nom et un prix.");const{error}=await sb.from("products").insert({cafe_id:S.mc.id,name:n,price:p,position:S.mprods.length});if(error)alert(error.message);loadM()}
// ---- administrateur
async function loadAdm(){const[c,o]=await Promise.all([sb.from("cafes").select("id,name,quartier,status,registration_paid,requested_at,cafe_private(nom,prenom,operator,momo_phone)").order("requested_at"),sb.from("orders").select("*,cafes(name,cafe_private(operator,momo_phone)),order_items(*)").order("id",{ascending:false}).limit(100)]);S.aC=c.data||[];S.aO=o.data||[];{const n=S.aO.filter(o=>o.status=="awaiting_payment").length;if(n>(S.na||0))beep(1000);S.na=n}if(S.v=="adm"&&!busy())render()}
async function am(fn,a){const{error}=await sb.rpc(fn,a);if(error)alert(error.message);loadAdm()}
// ---- rafraîchissement
setInterval(()=>{if(S.v=="dash")loadM();if(S.v=="adm")loadAdm();if(S.v=="wait")loadOrd()},3000);
setInterval(()=>{if(S.v=="dash"&&S.tab=="cmd"){const p=S.ords.filter(o=>o.status=="paid"&&rem(o)>0);if(p.length){beep(Math.min(...p.map(rem))<=10?2200:1400);if(!busy())render()}}},1000);
async function forgot(){const e=$("#fe").value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return fail("Cet e-mail n'est pas valide. Vérifie et corrige.");S.em=e;const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(error)return fail(error.message);S.err="";S.msg="Si cet e-mail a un compte, tu vas recevoir un lien dans quelques minutes. Regarde aussi dans les spams.";render()}
async function setPw(){const a=$("#p1").value,b=$("#p2").value;if(a.length<8)return fail("Le mot de passe doit avoir au moins 8 caractères.");if(a!==b)return fail("Les deux mots de passe ne sont pas pareils. Vérifie et corrige.");const{error}=await sb.auth.updateUser({password:a});if(error)return fail(error.message);alert("Mot de passe changé.");boot()}
sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){S.v="newpw";S.err="";render()}});
render();
</script></body></html>
